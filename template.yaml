AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  DealerPulse - serverless sales and CRM analytics pipeline.
  S3 upload -> Lambda validate/transform -> DynamoDB -> HTTP API -> dashboard.

Parameters:
  AlertEmail:
    Type: String
    Default: ""
    Description: Email to notify about rejected data and ingest failures (optional).

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]      # Graviton: cheaper per ms than x86
    Timeout: 60
    MemorySize: 256
    CodeUri: src/
    Environment:
      Variables:
        TABLE_NAME: !Ref MetricsTable
        LOG_LEVEL: INFO

Resources:
  # ---------------------------------------------------------------- storage
  # The bucket name is built with !Sub (not !Ref) wherever IAM policies need it.
  # Using !Ref here would create a circular dependency:
  #   bucket notification -> function -> role -> bucket
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "dealerpulse-${AWS::AccountId}-${AWS::Region}-data"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-raw-after-90-days   # raw files contain PII: don't keep forever
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: 90
          - Id: expire-quarantine-after-30-days
            Status: Enabled
            Prefix: quarantine/
            ExpirationInDays: 30

  MetricsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST       # no capacity planning, ~free at demo scale
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # ------------------------------------------------------------- messaging
  AlertTopic:
    Type: AWS::SNS::Topic

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  IngestDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600    # 14 days to investigate failures
      SqsManagedSseEnabled: true

  # --------------------------------------------------------------- compute
  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: ingest.lambda_handler
      Description: Validate, clean and aggregate uploaded lead CSVs
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt IngestDLQ.Arn
      Environment:
        Variables:
          ALERT_TOPIC_ARN: !Ref AlertTopic
      Policies:   # least privilege: read raw/, write only the output prefixes
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::dealerpulse-${AWS::AccountId}-${AWS::Region}-data/raw/*"
            - Effect: Allow
              Action: s3:PutObject
              Resource:
                - !Sub "arn:${AWS::Partition}:s3:::dealerpulse-${AWS::AccountId}-${AWS::Region}-data/processed/*"
                - !Sub "arn:${AWS::Partition}:s3:::dealerpulse-${AWS::AccountId}-${AWS::Region}-data/quarantine/*"
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt MetricsTable.Arn
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref AlertTopic
      Events:
        RawUpload:
          Type: S3
          Properties:
            Bucket: !Ref DataBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - {Name: prefix, Value: raw/}
                  - {Name: suffix, Value: .csv}

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.lambda_handler
      Description: Read-only metrics API
      MemorySize: 128
      Timeout: 10
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MetricsTable
      Events:
        Health:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /health, Method: GET}
        Metrics:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /metrics, Method: GET}
        Runs:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: /runs, Method: GET}

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]      # demo data only; restrict to your domain in production
        AllowMethods: [GET]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  # ------------------------------------------------------------ operations
  IngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${IngestFunction}"
      RetentionInDays: 14

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ApiFunction}"
      RetentionInDays: 14

  IngestErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Ingest Lambda raised an unhandled error (transient failure or bug)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref IngestFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

Outputs:
  BucketName:
    Description: Upload CSVs to s3://<this>/raw/
    Value: !Ref DataBucket
  ApiUrl:
    Description: Base URL for the dashboard (?api=<this>)
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  TableName:
    Value: !Ref MetricsTable
  DeadLetterQueueUrl:
    Value: !Ref IngestDLQ
